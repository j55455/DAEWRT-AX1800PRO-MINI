# ==============================================================================
# 青锋专属 · MosDNS 极简架构 (v5.0 精简版)
#
# 核心目标只有三件事：国内外分流 + 精准去广告 + 彻底防泄漏
# 执行拓扑：统计 -> 硬拦截(广告/PCDN/IPv6/PTR) -> 直连白名单 -> 缓存
#           -> 国外(防泄漏) -> 国内 -> 未知兜底(远端优先,国内丢非CN)
# ==============================================================================

log:
  level: warn
  file: "/var/log/mosdns.log"
  size: 1

# API 入口（仅本机监听，LuCI 统计页依赖）
api:
  http: "127.0.0.1:9091"

include: []

plugins:
  # 查询统计收集器（LuCI 统计页依赖，tag 必须为 stats_collector）
  - tag: stats_collector
    type: stats_api
    args:
      capacity: 2000

  # 广告域名库（精简广告库 ads-all + 自定义 blocklist，含 B站 PCDN 封杀）
  - tag: geosite_ads
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rule/ads-all.txt"
        - "/etc/mosdns/rule/blocklist.txt"
        - "/etc/mosdns/rule/awavenue-ads.txt"

  # 广告白名单（优先级高于广告拦截，放行业务误杀域名）
  - tag: ad_whitelist
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rule/ad-whitelist.txt"

  # 国内域名（geosite:cn）
  - tag: geosite_cn
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rule/geosite_cn.txt"

  # 强制国内直连白名单（机场节点域名、腾讯游戏调度、B站核心 CDN，绝不外发）
  - tag: whitelist
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rule/whitelist.txt"

  # 国外域名（geosite:geolocation-!cn）
  - tag: geosite_no_cn
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rule/geosite_no_cn.txt"

  # 国内 IP（防泄漏兜底判断用）
  - tag: geoip_cn
    type: ip_set
    args:
      files:
        - "/etc/mosdns/rule/geoip_cn.txt"

  # 本地保留地址反查（私网 PTR 不外发）
  - tag: local_ptr
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rule/local-ptr.txt"

  # 乐观缓存（RFC 8767：命中过期缓存秒回，后台异步刷新，防查询风暴）
  - tag: lazy_cache
    type: cache
    args:
      size: 20000
      lazy_cache_ttl: 86400
      dump_file: "/etc/mosdns/cache.dump"
      dump_interval: 600

  # 国内上游：阿里双入口 DoH 并发取最快（纯 IP 直连，无需 bootstrap）
  - tag: forward_local
    type: forward
    args:
      concurrent: 2
      upstreams:
        - tag: ali1
          addr: "https://223.5.5.5/dns-query"
          idle_timeout: 15
        - tag: ali2
          addr: "https://223.6.6.6/dns-query"
          idle_timeout: 15

  # 国外备用上游：AdGuard DNS 个人版（仅 NextDNS 超时 800ms 后接管，单发省配额）
  - tag: forward_adguard
    type: forward
    args:
      concurrent: 1
      upstreams:
        - tag: adguard
          addr: "https://d.adguard-dns.com/dns-query/94f14f4c"
          dial_addr: "94.140.14.14"
          idle_timeout: 30

  # 国外主上游：NextDNS 个人版（定制规则多，作为国外主力，单发省配额）
  - tag: forward_nextdns
    type: forward
    args:
      concurrent: 1
      upstreams:
        - tag: nextdns
          addr: "https://dns.nextdns.io/e3fe39"
          dial_addr: "45.90.30.186"
          idle_timeout: 30

  # 国外解析：NextDNS 主 + AdGuard 备（单发不双发，800ms 阈值抗抖，热态备用防冷启动假死）
  - tag: forward_remote
    type: fallback
    args:
      primary: forward_nextdns
      secondary: forward_adguard
      threshold: 800
      always_standby: true

  # 国内解析序列
  - tag: local_sequence
    type: sequence
    args:
      - exec: $forward_local

  # 国外解析序列（AAAA 已在硬拦截层全局拒答，此处无需重复）
  - tag: remote_sequence
    type: sequence
    args:
      - exec: $forward_remote

  # 本地硬拦截：IPv6 / TYPE65 / 私网 PTR / 广告（去广告 + 防泄漏基石）
  - tag: query_is_reject_domain
    type: sequence
    args:
      # 阻断 HTTPS(TYPE65) 防 ECH 逃逸，返回 NODATA
      - matches: qtype 65
        exec: reject 0
      # 私网 PTR 反查阻断，返回 NXDOMAIN，防内网信息外泄
      - matches:
          - qtype 12
          - qname $local_ptr
        exec: reject 3
      # 广告域名拦截（含 B站 PCDN），返回 NXDOMAIN；白名单域名放行
      - matches:
          - qname $geosite_ads
          - "!qname $ad_whitelist"
        exec: reject 3

  # 未知域名国内兜底序列（防泄漏铁闸：国内解析结果若非 CN IP 直接丢弃）
  - tag: query_is_local_ip
    type: sequence
    args:
      - exec: $local_sequence
      - matches: "!resp_ip $geoip_cn"
        exec: drop_resp

  # 未知域名远端序列
  - tag: query_is_remote
    type: sequence
    args:
      - exec: $remote_sequence

  # 未知冷门域名兜底：远端加密优先（防泄漏），超时 2.5s 由国内 DoH 兜底
  - tag: fallback
    type: fallback
    args:
      primary: query_is_remote
      secondary: query_is_local_ip
      threshold: 2500
      always_standby: false

  # 主流水线（线性，去除全部冗余跳转）
  - tag: main_sequence
    type: sequence
    args:
      - exec: $stats_collector

      # 1. 硬拦截：广告 / PCDN / IPv6 / TYPE65 / 私网PTR
      - exec: $query_is_reject_domain
      - matches: has_resp
        exec: accept

      # 2. 直连白名单（机场节点/游戏/B站核心 -> 阿里 DoH，跳缓存保鲜）
      - matches: qname $whitelist
        exec: $local_sequence
      - matches: has_resp
        exec: accept

      # 3. 乐观缓存（毫秒秒回 + 后台异步刷新）
      - exec: $lazy_cache
      - matches: has_resp
        exec: accept

      # 4. 国外域名：AAAA(IPv6) 拒答强制走 IPv4 代理（代理节点多为 v4 出口 / 国外 v6 直连必被墙），
      #    A 记录走国外加密 DNS（先于国内判断，防泄漏）
      - matches:
          - qname $geosite_no_cn
          - qtype 28
        exec: reject 0
      - matches: qname $geosite_no_cn
        exec: $remote_sequence
      - matches: has_resp
        exec: accept

      # 5. 国内域名 -> 阿里双入口 DoH 并发（A + AAAA 均放行，国内 IPv6 直连走 NAT66）
      - matches: qname $geosite_cn
        exec: $local_sequence
      - matches: has_resp
        exec: accept

      # 6. 未匹配冷门域名：AAAA 拒答（防泄漏，强制走 IPv4 代理），A 记录远端优先兜底
      - matches: qtype 28
        exec: reject 0
      - exec: $fallback

  # UDP 服务器
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"

  # TCP 服务器
  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"
